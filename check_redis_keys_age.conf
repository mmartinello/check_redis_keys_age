/**
 * CheckCommand definition for check_redis_keys_age
 *
 * Monitors Redis keys by age using OBJECT IDLETIME.
 * Requires check_redis_keys_age to be installed in PluginDir.
 *
 * Installation:
 *   cp check_redis_keys_age.conf /etc/icinga2/conf.d/check_redis_keys_age.conf
 *   icinga2 daemon --validate
 *   systemctl reload icinga2
 */

object CheckCommand "check_redis_keys_age" {
    command = [ PluginDir + "/check_redis_keys_age" ]

    arguments = {
        "-H" = {
            value       = "$redis_keys_age_host$"
            description = "Redis server hostname or IP address"
            required    = true
        }
        "-P" = {
            value       = "$redis_keys_age_port$"
            description = "Redis server port"
        }
        "-D" = {
            value       = "$redis_keys_age_database$"
            description = "Redis database number"
        }
        "-p" = {
            value       = "$redis_keys_age_pattern$"
            description = "Regular expression matched against key names"
            required    = true
        }
        "-w" = {
            value       = "$redis_keys_age_warning$"
            description = "Warning threshold in seconds (oldest key idle time)"
        }
        "-c" = {
            value       = "$redis_keys_age_critical$"
            description = "Critical threshold in seconds (oldest key idle time)"
        }
        "-a" = {
            value       = "$redis_keys_age_password$"
            description = "Redis AUTH password"
        }
        "-t" = {
            value       = "$redis_keys_age_timeout$"
            description = "Connection and socket timeout in seconds"
        }
    }

    // Defaults — override at the host or service level as needed.
    vars.redis_keys_age_host     = "$address$"
    vars.redis_keys_age_port     = 6379
    vars.redis_keys_age_database = 0
    vars.redis_keys_age_timeout  = 10
}
